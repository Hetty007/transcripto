<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transcripto | YouTube Transcript</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="logo">Transcripto</h1>
    </header>
    <section class="input-section">
      <input id="url" type="text" placeholder="Enter YouTube video URL" />
      <button id="go" class="btn btn-primary">Transcribe</button>
      <p id="error" class="error"></p>
    </section>
    <section id="language-section" class="hidden language-card">
      <h2>Select a language</h2>
      <div id="languageButtons" class="button-group"></div>
    </section>
    <section id="transcript-section" class="hidden">
      <div class="player-transcript">
        <div class="player">
          <iframe id="player" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="transcript-container">
          <pre id="result" class="transcript"></pre>
          <div class="controls">
            <button id="copyBtn" class="btn btn-copy">
              <svg class="icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
              Copy Text
            </button>
            <button id="downloadBtn" class="btn btn-secondary">
              <svg class="icon" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18L5.33 9h3.84v6h4.66v-6h3.84L12 2z"/></svg>
              Download .txt
            </button>
          </div>
        </div>
      </div>
    </section>
    <footer class="footer">
      <p class="small-text">Made by Nazar Biletskyi</p>
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
